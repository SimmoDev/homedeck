dependencies:
  # Espressif's own official Tab5 BSP - handles MIPI-DSI panel + touch init
  # (runtime probing between ili9881c+gt911 and st7123+st7123 hardware
  # revisions) without going through M5Unified/M5GFX's Arduino-as-Component
  # path, which has a confirmed crash on this exact chip (m5stack/M5Unified#231)
  # - see docs/architecture/hardware.md#display-and-touch and
  # docs/decisions/ADR-0009-touch-display-detection.md.
  espressif/m5stack_tab5: "^1.2.0~1"
  # m5stack_tab5 unconditionally pulls in `usb` (for camera/UVC support we
  # don't use for display bring-up). Its auto-resolved version calls a HAL
  # function (custom FIFO sizing) that ESP-IDF v5.4.2 doesn't have - fixed
  # by requiring v5.4.3 instead, which backported it, without needing
  # v5.5.x (which has its own confirmed DSI display bugs - see
  # hardware.md#display-and-touch). Project-wide IDF version bumped
  # accordingly - see DEVELOPMENT.md#esp-idf-setup.
  idf: ">=5.4.3"
  # The BSP's own capability table explicitly marks battery as
  # unsupported and doesn't cover RTC at all - see
  # docs/decisions/ADR-0016-battery-rtc-library.md. espp is a separate,
  # actively maintained third-party ESP-IDF C++ component ecosystem (not
  # Espressif's own, unlike m5stack_tab5) - checked before depending on
  # it: real release cadence, MIT licensed, both components only require
  # idf >=5.0, comfortably satisfied by the v5.4.3 pin above.
  espp/ina226: "^1.1.6"
  espp/rx8130ce: "^1.1.6"
  # Wi-Fi isn't native to the P4 - it runs through the ESP32-C6
  # co-processor over SDIO (see hardware.md#wireless). esp_wifi_remote
  # exposes the standard esp_wifi API transparently proxied to the C6 via
  # ESP-Hosted, rather than a separate ESP-Hosted-specific API surface.
  # Real risk being tested right now: esp_wifi_remote depends on
  # esp_hosted ">=2.11", but esp_hosted's newest line (3.0.0) requires
  # idf >=5.5, which conflicts with the v5.4.3 pin above (needed for the
  # display fix). Whether the resolver picks a compatible 2.12.x
  # esp_hosted release instead is being confirmed by an actual build, not
  # assumed from the version numbers alone.
  espressif/esp_wifi_remote: "*"
