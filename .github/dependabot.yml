# Keeps the SHA-pinned actions in .github/workflows/ and the Web UI's npm
# dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 has no JavaScript compiler API, which svelte-check
      # loads (peer range ^5 || ^6); drop this once svelte-check supports it.
      - dependency-name: typescript
        versions: [">=7.0.0"]
