name: Lint check

# Runs the six tools/githooks/ checks that have no other CI backstop
# (check-esp-idf-returns.sh/check-curl-timeouts.sh/check-esp-http-timeouts.sh/
# check-unauthenticated-routes.sh/check-unchecked-json-field-access.sh/
# check-json-dump-strict.sh) against every tracked file, not just a
# commit's diff - same "the local pre-commit hook only ever sees staged
# files, so a violation in a file nobody happens to touch again stays
# invisible indefinitely" reasoning
# docs.yml already uses for check-docs.sh/check-hardware-md-scope.sh.
# Non-blocking, same as the pre-commit hook itself (see pre-commit's own
# header comment for why these six stay warn-only): this is a periodic
# report, not a merge gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rather than only on push/PR - catches drift in files that
    # simply haven't been touched by any commit recently.
    - cron: "0 6 * * 1"

jobs:
  lint:
    name: Full-repo esp-idf-returns/curl-timeout/esp-http-timeout/unauthenticated-route/json-field-type/json-dump-strict sweep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run check-esp-idf-returns.sh and check-esp-http-timeouts.sh against firmware/main and src/platform/firmware
        continue-on-error: true
        run: |
          files=$(git ls-files -- 'firmware/main/*.cpp' 'firmware/main/*.h' 'firmware/main/*.hpp' 'src/platform/firmware/*.cpp' 'src/platform/firmware/*.h' 'src/platform/firmware/*.hpp')
          bash tools/githooks/check-esp-idf-returns.sh $files
          bash tools/githooks/check-esp-http-timeouts.sh $files

      # Deterministic, so a mismatch fails the job instead of only
      # reporting - see check-lvgl-version-sync.sh's own header.
      - name: Check the simulator and firmware resolve the same LVGL version
        run: bash tools/githooks/check-lvgl-version-sync.sh

      - name: Run check-curl-timeouts.sh, check-unauthenticated-routes.sh, check-unchecked-json-field-access.sh, and check-json-dump-strict.sh against every tracked .cpp/.h/.hpp file
        continue-on-error: true
        run: |
          files=$(git ls-files -- '*.cpp' '*.h' '*.hpp')
          bash tools/githooks/check-curl-timeouts.sh $files
          bash tools/githooks/check-unauthenticated-routes.sh $files
          bash tools/githooks/check-unchecked-json-field-access.sh $files
          bash tools/githooks/check-json-dump-strict.sh $files
