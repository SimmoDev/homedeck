name: Simulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build simulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev libcurl4-openssl-dev libavahi-client-dev

      # The Web UI's Svelte/Vite bundle is a build prerequisite, not
      # auto-invoked from CMake (see
      # docs/decisions/ADR-0025-webui-static-asset-storage.md)
      # - the simulator's CMakeLists.txt fails at configure time if
      # webui/dist/ doesn't exist yet.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # svelte-check and vitest run here, not duplicated in firmware.yml's
      # identical build step - one CI job is enough for gates with no
      # target-specific behavior.
      - name: Build Web UI bundle
        working-directory: webui
        run: |
          npm ci
          npm run check
          npm run test
          npm run build

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: simulator/build/_deps
          key: simulator-deps-${{ hashFiles('simulator/CMakeLists.txt') }}

      - name: Configure
        working-directory: simulator
        run: cmake -B build -G Ninja

      - name: Build
        working-directory: simulator
        run: cmake --build build
