name: Secret scan

# Runs tools/githooks/check-secrets.sh against every tracked file, not
# just a commit's diff - the same "full tree, not diff" reasoning
# docs.yml already uses, so a leak in a file nobody happens to touch
# again doesn't stay invisible. Blocking, unlike docs.yml: local
# pre-commit hook activation (git config core.hooksPath tools/githooks)
# is a per-clone opt-in, and --no-verify/GUI clients bypass it entirely
# - CI is the only enforcement point that applies unconditionally, and
# check-secrets.sh's own patterns are narrow/high-precision (private
# key headers, known credential-token shapes), the same reasoning
# pre-commit already uses to block locally on this one check alone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-secrets:
    name: Full-repo check-secrets.sh sweep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run check-secrets.sh against every tracked file
        run: |
          files=$(git ls-files)
          bash tools/githooks/check-secrets.sh $files
