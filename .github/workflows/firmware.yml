name: Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check for ESP-IDF project
        id: check
        run: |
          if [ -f firmware/CMakeLists.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # firmware/ has no ESP-IDF project yet - see docs/roadmap.md M1's
      # "ESP-IDF project scaffolding" item. This starts actually building
      # the moment that lands, with no workflow change needed.
      - name: Skip (no ESP-IDF project yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "firmware/CMakeLists.txt not found - nothing to build yet."

      - name: Build via ESP-IDF Docker image
        if: steps.check.outputs.exists == 'true'
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$(pwd)/firmware:/project" -w /project \
            espressif/idf:v5.4.2 idf.py set-target esp32p4 build
