name: Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Runs as root inside the container - simplest option, and fine here
      # since the runner VM is thrown away after the job, unlike a local
      # dev machine where root-owned build output would be a real
      # nuisance (see DEVELOPMENT.md's ESP-IDF setup for the local case).
      - name: Build via ESP-IDF Docker image
        run: |
          docker run --rm -v "$(pwd)/firmware:/project" -w /project \
            espressif/idf:v5.4.2 idf.py set-target esp32p4 build
