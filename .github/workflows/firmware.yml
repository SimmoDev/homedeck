name: Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Web UI's Svelte/Vite bundle is a build prerequisite, not
      # auto-invoked from CMake/idf.py (see
      # docs/decisions/ADR-0025-webui-static-asset-storage.md)
      # - EMBED_FILES needs webui/dist/ to exist before idf.py build runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build Web UI bundle
        working-directory: webui
        run: |
          npm ci
          npm run build

      # Runs as root inside the container - simplest option, and fine here
      # since the runner VM is thrown away after the job, unlike a local
      # dev machine where root-owned build output would be a real
      # nuisance (see DEVELOPMENT.md's ESP-IDF setup for the local case).
      #
      # Mounts the repo root, not just firmware/ - the firmware component
      # reuses portable source directly from ../../src (see
      # firmware/main/CMakeLists.txt), which needs to be visible
      # inside the container. Working directory is set to firmware/ so
      # idf.py's own behavior (build/, sdkconfig, etc.) is unaffected.
      - name: Build via ESP-IDF Docker image
        run: |
          docker run --rm -v "$(pwd):/project" -w /project/firmware \
            espressif/idf:v5.4.3 idf.py set-target esp32p4 build
