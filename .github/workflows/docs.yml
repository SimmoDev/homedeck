name: Docs check

# Runs tools/githooks/check-docs.sh against every tracked doc/code file,
# not just a commit's diff. The pre-commit hook only ever sees staged
# files, so a narration/wording violation in a file nobody happens to
# touch again stays invisible indefinitely - a full-repo periodic run is
# the only way to catch it.
# The files holding the checker's own patterns are excluded: they quote
# every banned phrase and would always match.
# Non-blocking, same as the pre-commit hook itself: a full-repo run also
# surfaces plenty of pre-existing, legitimate "real"-as-adjective usage
# and the project's own "**Confirmed:**"-as-fact-marker convention in
# hardware.md, neither worth gating a build on. This is a periodic
# report, not a merge gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rather than only on push/PR - catches drift in files that
    # haven't been touched by any commit recently.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check-docs:
    name: Full-repo check-docs.sh sweep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run check-docs.sh against every tracked doc/code file
        continue-on-error: true
        run: |
          files=$(git ls-files -- \
            '*.md' '*.cpp' '*.cc' '*.h' '*.hpp' '*.ts' '*.svelte' '*.yml' '*.yaml' '*.sh' \
            '*sdkconfig*' 'CMakeLists.txt' '**/CMakeLists.txt' '*.cmake' \
            ':!firmware/components/m5stack_tab5/**' \
            ':!src/third_party/nlohmann/**' \
            ':!tools/githooks/lib-narration-patterns.sh' \
            ':!tools/githooks/check-docs.sh')
          bash tools/githooks/check-docs.sh $files

      - name: Run check-hardware-md-scope.sh against docs/architecture/hardware.md
        continue-on-error: true
        run: bash tools/githooks/check-hardware-md-scope.sh docs/architecture/hardware.md
